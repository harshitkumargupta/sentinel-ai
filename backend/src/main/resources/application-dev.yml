spring:
  datasource:
    # Override with env vars (DB_URL / DB_USER / DB_PASSWORD) when needed.
    # Defaults match infrastructure/docker/docker-compose.yml.
    url: ${DB_URL:jdbc:mysql://localhost:3306/sentinelai?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Baseline as version 0 so V1 (and later) still run on a pre-existing/empty schema.
    baseline-version: 0
    locations: classpath:db/migration

sentinel:
  jwt:
    # DEV ONLY default secret (>= 32 chars). Override with JWT_SECRET everywhere else.
    secret: ${JWT_SECRET:dev-only-sentinel-ai-super-secret-key-change-me-0123456789}
  simulator:
    enabled: true
    default-intensity: 5
  demo:
    # Demo Center + quick-login for the documented dev accounts.
    enabled: true
    quick-login: true
  redis:
    enabled: ${REDIS_ENABLED:true}
  kafka:
    # Dev runs the full pipeline against the local Kafka (docker compose up). If the broker is down,
    # ingestion degrades gracefully to the synchronous path. Set KAFKA_ENABLED=false to force sync.
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  ai:
    # Dev uses the offline 'local' engine (no API key needed). For a real model set AI_PROVIDER=http
    # and export LLM_API_KEY.
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:local}

logging:
  level:
    com.sentinelai: DEBUG
    org.hibernate.SQL: DEBUG
