spring:
  application:
    name: sentinel-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

# JWT: secret MUST be supplied via env (JWT_SECRET) in every real environment.
# A dev-only default is set in application-dev.yml. TTLs are in milliseconds.
sentinel:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 900000      # 15 minutes
    refresh-token-ttl: 604800000  # 7 days
  security:
    max-failed-logins: 5
    lockout-minutes: 15
  ml:
    enabled: ${ML_ENABLED:false}
    base-url: ${ML_BASE_URL:http://localhost:8000}
    timeout-ms: 800
    max-retries: 1
    weight-cap: 30
    drift-sigma-threshold: 3.0
    drift-cron: "0 */15 * * * *"
  detection:
    enabled: true
    max-linked-events: 100
    severity-scores:
      LOW: 25
      MEDIUM: 50
      HIGH: 75
      CRITICAL: 100

# OpenAPI / Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator: /api/health is our public endpoint; actuator stays under /actuator
# Include the per-request trace id (MDC) in every log line.
logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
