spring:
  datasource:
    # Production expects these to be supplied via environment / secrets manager.
    url: ${DB_URL:jdbc:mysql://mysql:3306/sentinelai?serverTimezone=UTC&useSSL=true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

logging:
  level:
    com.sentinelai: INFO
    root: WARN
