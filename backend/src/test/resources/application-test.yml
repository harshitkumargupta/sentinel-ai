# Test profile — runs @DataJpaTest slices against a dedicated local MySQL database
# (sentinelai_test). Docker isn't installed in this environment; once it is, these tests
# should move to Testcontainers (see README) so they no longer depend on a local server.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/sentinelai_test?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TEST_DB_USER:sentinel}
    password: ${TEST_DB_PASSWORD:sentinel}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

sentinel:
  jwt:
    secret: test-only-sentinel-ai-secret-key-0123456789-abcdefghij
    access-token-ttl: 900000
    refresh-token-ttl: 604800000
  simulator:
    enabled: true
    default-intensity: 3

logging:
  level:
    org.hibernate.SQL: WARN
