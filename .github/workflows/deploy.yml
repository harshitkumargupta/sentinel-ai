name: Deploy (optional)

# Optional continuous deployment to a single VM (e.g. an Oracle Cloud Always Free instance) over
# SSH. DISABLED BY DEFAULT: it only runs on a manual dispatch or when a version tag is pushed, and
# every step is a no-op unless the SSH_HOST secret is configured. See docs/deployment.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. a git SHA or vX.Y.Z)'
        required: true
        default: 'latest'
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Guard — require SSH_HOST
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "SSH_HOST not configured — CD is disabled. Skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tag
        if: steps.guard.outputs.enabled == 'true'
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull + deploy.sh with auto-rollback)
        if: steps.guard.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" \
            "cd ~/sentinel-ai && git pull --ff-only && ./scripts/deploy.sh '${TAG}'"
