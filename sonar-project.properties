# SonarQube project configuration for SentinelAI.
# Run after a build (so JaCoCo + compiled classes exist):
#   mvn -f backend/pom.xml clean verify
#   sonar-scanner    (with SONAR_HOST_URL / SONAR_TOKEN set; see docs/security/scan-results.md)

sonar.projectKey=sentinel-ai
sonar.projectName=SentinelAI
sonar.projectVersion=0.14.0

# Sources / tests
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/**/*.jar

# Coverage (JaCoCo XML produced by `mvn verify`)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions: generated/third-party and non-shipping code
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,ml/data/**

# Quality gate intent (enforced server-side; documented in docs/security/scan-results.md):
#   - No new Blocker or Critical issues.
#   - Coverage on new code >= 70%.
