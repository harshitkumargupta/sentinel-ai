# SentinelAI :: production stack (zero-cost: Docker Compose + Caddy, optional Cloudflare Tunnel).
#
#   cp infrastructure/docker/.env.example infrastructure/docker/.env   # then edit secrets
#   ./scripts/deploy.sh <tag>            # pull, deploy, health-check, smoke-test, auto-rollback
#
# Images are pulled from GHCR by tag. For a local trial, build with tag "local" (see scripts) and
# set IMAGE_BASE=sentinel-ai, TAG=local. Only Caddy publishes ports; everything else is on the
# internal network. Secrets come from the .env file (gitignored); none are printed.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sentinelai}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  backend:
    image: ${IMAGE_BASE:?set IMAGE_BASE}-backend:${TAG:?set TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sentinelai}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET (>=32 chars) in .env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      # One-time bootstrap admin (only applied when the DB has no users yet).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      KAFKA_ENABLED: "${KAFKA_ENABLED:-false}"
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *default-logging

  frontend:
    image: ${IMAGE_BASE:?set IMAGE_BASE}-frontend:${TAG:?set TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # 127.0.0.1 (not localhost): nginx listens on IPv4 only; busybox wget may try ::1 first.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging

  ml:
    image: ${IMAGE_BASE:?set IMAGE_BASE}-ml:${TAG:?set TAG}
    profiles: ["ml"]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # SITE_ADDRESS=:80 (plain HTTP localhost) or a domain (Caddy gets automatic HTTPS).
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [internal]
    logging: *default-logging

  # Optional: free public HTTPS URL with no open ports. Enable with:  --profile tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    depends_on:
      - caddy
    networks: [internal]
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
