# SentinelAI :: observability stack (zero-cost). Prometheus + Grafana, with optional Loki (logs)
# and Jaeger (traces) profiles.
#
#   docker compose -f infrastructure/docker/monitoring.yml up -d
#   # with logs:   --profile loki     with traces:  --profile tracing
#
# Prometheus scrapes the backend's /actuator/prometheus. By default it targets the host-run backend
# via host.docker.internal:8080 (dev). For the prod stack, set PROM_TARGET=backend:8080 and attach
# this to the app network, or merge into docker-compose.prod.yml.
#
# Grafana: http://localhost:3000 (admin / admin on first login). Datasource + dashboards are
# provisioned as code from infrastructure/grafana/.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinel-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # Optional: log aggregation (profile: loki).
  loki:
    image: grafana/loki:3.1.1
    container_name: sentinel-loki
    profiles: ["loki"]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  # Optional: distributed tracing (profile: tracing). Point the backend at it with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and TRACING_SAMPLE_RATE=1.0.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: sentinel-jaeger
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP

volumes:
  prometheus_data:
  grafana_data:
