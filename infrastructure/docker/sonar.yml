# SonarQube (static analysis + coverage) for SentinelAI — run on demand, separate from the app stack.
#
#   docker compose -f infrastructure/docker/sonar.yml up -d
#   # then, after `mvn -f backend/pom.xml clean verify`:
#   SONAR_HOST_URL=http://localhost:9000 SONAR_TOKEN=<token> sonar-scanner
#
# Quality gate (configured in the SonarQube UI, documented in docs/security/scan-results.md):
#   - 0 new Blocker/Critical issues
#   - >= 70% coverage on new code
services:
  sonarqube:
    image: sonarqube:10.6-community
    container_name: sentinel-sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:16-alpine
    container_name: sentinel-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
