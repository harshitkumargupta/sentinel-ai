global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: sentinel-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # Dev: host-run backend. Prod: set to backend:8080 on the app network.
      - targets: ['host.docker.internal:8080']
        labels:
          application: sentinel-ai

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
