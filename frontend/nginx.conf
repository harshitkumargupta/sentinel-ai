# Hardened static-site server for the SentinelAI SPA (nginx-unprivileged, listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: behind the proxy, an absolute one would point at this container's port.
    absolute_redirect off;

    # Do not advertise the server version.
    server_tokens off;

    # Security headers (mirror the API's posture for the app shell).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP: the SPA loads its own bundle from 'self' and calls the API via /api (same origin behind the
    # proxy). 'unsafe-inline' is limited to styles (Vite injects a few); scripts are 'self'.
    # blob: is required because the 3D globe (GLTFLoader) decodes the earth model's embedded textures
    # into blob: URLs and off-main-thread workers; 'wasm-unsafe-eval' is for three.js' glTF decoders.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
